<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samuel Massari</title>
    <meta name="description" content="The engineering consulting site for Samuel Massari has moved to samuelmassari.com." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://samuelmassari.com" />
    <link rel="icon" href="/archive/img/bitmoji_avatar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #f7f3ea;
        --foreground: #3b3833;
        --muted: #6f6a61;
        --accent: #9a5f3c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family: "DM Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      h1 {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2rem, 6vw, 2.75rem);
        margin: 0 0 1rem;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        padding-bottom: 1px;
      }
      a:hover {
        color: var(--foreground);
      }
      .rule {
        width: 3rem;
        height: 1px;
        background: var(--accent);
        margin: 0 auto 2rem;
      }
      .archive {
        margin-top: 3rem;
        padding-top: 1.75rem;
        border-top: 1px solid rgba(59, 56, 51, 0.15);
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="rule" aria-hidden="true"></div>
      <h1>This site has moved</h1>
      <p>
        Samuel Massari's portfolio site is now a site for his engineering consulting
        practice. The new site lives at
        <a href="https://samuelmassari.com">samuelmassari.com</a>.
      </p>
      <p class="archive">
        Looking for the original portfolio site from 2019&ndash;2026? It is preserved
        <a href="/archive/">here</a>.
      </p>
    </main>
  </body>
</html>
